aid: coru
name: Coru
description: >-
  Coru is an enterprise-grade AI company transforming financial services across
  Latin America with conversational AI agents. Its "Adi" platform lets banks,
  fintechs, and insurers build and customize agentic workflows for digital loan
  origination, 24/7 customer service, collections management, insurance quoting,
  claims handling, and commission reconciliation across web, app, and WhatsApp
  channels in Spanish, Portuguese, and English, with multimodal input (text,
  voice, audio, documents) and OCR-based document capture. Coru serves financial
  institutions including Bradesco, Banorte, and Neon, and is backed by QED
  Investors. Coru markets a hosted, enterprise agent product and does not
  currently publish a public developer API, documentation portal, or SDKs.
